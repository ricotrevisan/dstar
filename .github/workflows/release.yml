name: Release

# Publishes to Hex with Workload Identity (no stored HEX_API_KEY):
# https://hex.pm/docs/workload-identity
# hex.pm trusts owner `ricotrevisan`, repo `dstar`, workflow `release.yml`,
# environment `release`. Renaming this file or the environment breaks publishing.
#
# Only the `publish` job can mint the OIDC token, and it runs nothing but the
# publish itself. Tests run before it, the GitHub Release after it, each
# without that permission. Actions are pinned to commit SHAs.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - name: Check tag format and that it matches mix.exs
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not vMAJOR.MINOR.PATCH[-pre]"
            exit 1
          fi
          version=$(sed -n 's/^  @version "\(.*\)"$/\1/p' mix.exs)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match mix.exs version $version"
            exit 1
          fi

      - name: Check CHANGELOG has a section for this version
        run: .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > /dev/null

      - run: mix deps.get
      - run: mix hex.audit
      - run: mix compile --warnings-as-errors
      - run: mix test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    # Protection rules (required reviewer, `v*` tags only) live on this environment.
    environment: release
    permissions:
      contents: read
      id-token: write # OIDC token that mix exchanges for a 15-minute Hex token
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Workload Identity needs OTP 27+ and Hex 2.6+.
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - run: mix local.hex --force
      - run: mix deps.get

      # No HEX_API_KEY: a configured key would take precedence over Workload
      # Identity. Expect "Authenticated with Workload Identity" in the log.
      # Publishes the package and its docs.
      - name: Publish to Hex
        run: mix hex.publish --yes

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          .github/scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            --verify-tag
